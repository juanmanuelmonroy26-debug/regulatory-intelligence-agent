name: Regulatory Intelligence Monitor

on:
  schedule:
    - cron: '0 12 * * *'   # 07:00 Colombia time (UTC-5), daily
  workflow_dispatch:         # allow manual trigger for testing

permissions:
  contents: write            # needed to commit and push snapshots

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regulatory pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python pipeline.py

      - name: Commit and push snapshots, logs, and reports
        run: |
          git config user.name "regulatory-bot"
          git config user.email "bot@alegra.com"
          git add snapshots/ logs/ reports/
          git diff --staged --quiet || git commit -m "chore: regulatory snapshot $(date -u +%Y-%m-%d) [skip ci]"
          git push
